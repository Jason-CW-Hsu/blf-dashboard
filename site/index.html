<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>勞動基金運用局｜基金儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f4f7fa;color:#17365d}
    header{background:#17365d;color:#fff;padding:24px max(20px,calc((100vw - 1200px)/2))}
    h1{margin:0;font-size:24px}
    .sub{font-size:14px;opacity:.8;margin-top:8px}
    main{max-width:1200px;margin:24px auto;padding:0 20px}
    .cards,.charts{display:grid;gap:16px}
    .cards{grid-template-columns:repeat(5,1fr)}
    .charts{grid-template-columns:repeat(3,1fr);margin:20px 0}
    .wide{grid-template-columns:1fr 1fr}
    .card,.panel{background:#fff;border:1px solid #d9e2f3;border-radius:10px;padding:14px}
    .card b{display:block;font-size:22px;margin-top:8px}
    .panel h2{font-size:16px;margin:0 0 8px}
    .panel canvas{max-height:300px}
    .fx{background:#eaf3fb;border-left:4px solid #5b9bd5;padding:10px;font-size:13px}
    table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
    th,td{padding:8px;border-bottom:1px solid #d9e2f3;text-align:right}
    th:first-child,td:first-child{text-align:left}
    tr.total td{font-weight:700;background:#eaf3fb;border-top:2px solid #5b9bd5}
    @media(max-width:850px){.cards,.charts,.wide{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>勞動基金運用局｜四大基金儀表板</h1>
    <div class="sub">資料期間：115 年 6 月｜所有金額均為美元($B)</div>
  </header>
  <main>
    <section class="cards" id="totals"></section>
    <p class="fx">美元換算：臺銀 USD/TWD 即期賣出 <b id="fx"></b>｜報價時間：2026-08-26 04:40｜<a href="https://rate.bot.com.tw/xrt?Lang=en-US">公開匯率來源</a></p>
    <section class="charts" id="funds"></section>
    <section class="charts wide">
      <div class="panel"><h2>國內委外｜前十大目前淨資產與市占率</h2><canvas id="domestic"></canvas></div>
      <div class="panel"><h2>國外委外｜前十大目前淨資產與市占率</h2><canvas id="overseas"></canvas></div>
    </section>
    <section class="charts wide">
      <div class="panel">
        <h2>國內委外｜前十大業者明細</h2>
        <table>
          <thead><tr><th>業者</th><th>目前淨資產（美元($B)）</th><th>市占率</th></tr></thead>
          <tbody id="domRows"></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>國外委外｜前十大業者明細</h2>
        <table>
          <thead><tr><th>業者</th><th>目前淨資產（美元($B)）</th><th>市占率</th></tr></thead>
          <tbody id="ovrRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
  const d={fx:31.945,f:[['新制',57963.5,[7156.6,747.7,454.1,5859.3,15180.9,5570.3]],['舊制',11622.6,[308.4,234,0,1080.4,2413.1,1201.3]],['勞工保險',16820.7,[1905.5,936.8,108.6,939.4,2212.2,1383.9]],['國民年金',9043.3,[1081.9,574.3,226.5,427.2,1686.1,296]],['四大基金合計',95450.1,[10452.4,2492.8,789.3,8306.2,21492.3,8451.4]]],dom:[['野村',577791297925,.2418],['安聯',357673538046,.1497],['國泰',286214667961,.1198],['復華',265198460141,.1110],['統一',250541373579,.1049],['滙豐',106919554084,.0447],['玉山',103186108725,.0432],['台新',95674974078,.0400],['施羅德',95092170081,.0398],['富邦',74116779771,.0310]],ovr:[['貝萊德',18069193180,.1382],['道富',12081425660,.0924],['北美信託',8334588169,.0638],['JPMorgan（國外）',7276491843,.0557],['威靈頓',6382647431,.0488],['PIMCO',5969355836,.0457],['景順',5125662125,.0392],['LGIM',5068312010,.0388],['Geode',4934292092,.0377],['DWS',4535580434,.0347]]};
  const labs=['自行-固定收益','自行-權益','自行-另類','委託-固定收益','委託-權益','委託-另類'],c=['#9dc3e6','#5b9bd5','#2f75b5','#f4b183','#ed7d31','#c55a11'];
  const usdB=v=>v/d.fx/10, managerUsdB=v=>v/1e9/d.fx, money=v=>'$'+v.toFixed(2)+'B';
  const sliceLabels={id:'sliceLabels',afterDatasetsDraw(chart){const {ctx}=chart;const data=chart.data.datasets[0].data,total=data.reduce((a,b)=>a+b,0);ctx.save();ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';chart.getDatasetMeta(0).data.forEach((arc,i)=>{const p=arc.getProps(['x','y','startAngle','endAngle','innerRadius','outerRadius'],true),pct=data[i]/total;if(pct<.035)return;const angle=(p.startAngle+p.endAngle)/2,r=(p.innerRadius+p.outerRadius)/2;ctx.fillStyle='#fff';ctx.fillText((pct*100).toFixed(1)+'%',p.x+Math.cos(angle)*r,p.y+Math.sin(angle)*r)});ctx.restore()}};
  const shareLabels={id:'shareLabels',afterDatasetsDraw(chart){const {ctx}=chart,meta=chart.getDatasetMeta(1),data=chart.data.datasets[1].data;ctx.save();ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';meta.data.forEach((point,i)=>{const p=point.getProps(['x','y'],true),label=data[i].toFixed(1)+'%',w=ctx.measureText(label).width+8;ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(p.x-w/2,p.y-22,w,16);ctx.fillStyle='#c55a11';ctx.fillText(label,p.x,p.y-8)});ctx.restore()}};
  document.querySelector('#fx').textContent=d.fx.toFixed(3);
  document.querySelector('#totals').innerHTML=d.f.map(x=>`<div class="card">${x[0]}<b>${money(usdB(x[1]))}</b></div>`).join('');
  d.f.forEach((x,i)=>{funds.insertAdjacentHTML('beforeend',`<div class="panel"><h2>${x[0]}｜${money(usdB(x[1]))}</h2><canvas id="f${i}"></canvas></div>`);new Chart(document.querySelector('#f'+i),{type:'doughnut',data:{labels:labs,datasets:[{data:x[2],backgroundColor:c}]},plugins:[sliceLabels],options:{plugins:{legend:{position:'bottom'}}}})});
  function bar(id,a,toUsdB){new Chart(document.querySelector(id),{data:{labels:a.map(x=>x[0]),datasets:[{type:'bar',label:'目前淨資產（美元($B)）',data:a.map(x=>toUsdB(x[1])),backgroundColor:'#5b9bd5',yAxisID:'y'},{type:'line',label:'市占率',data:a.map(x=>x[2]*100),borderColor:'#ed7d31',backgroundColor:'#ed7d31',pointRadius:4,pointHoverRadius:5,yAxisID:'y1'}]},plugins:[shareLabels],options:{layout:{padding:{top:24}},scales:{y:{title:{display:true,text:'美元($B)'},ticks:{callback:v=>'$'+v.toFixed(1)+'B'}},y1:{position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'市占率'},ticks:{callback:v=>v+'%'}}}}})}
  bar('#domestic',d.dom,managerUsdB);
  bar('#overseas',d.ovr,v=>v/1e9);
  const tableRows=(a,toUsdB,total)=>a.map(x=>`<tr><td>${x[0]}</td><td>${money(toUsdB(x[1]))}</td><td>${(x[2]*100).toFixed(1)}%</td></tr>`).join('')+`<tr class="total"><td>全數業者合計</td><td>${money(toUsdB(total))}</td><td>100.0%</td></tr>`;
  domRows.innerHTML=tableRows(d.dom,managerUsdB,2389455273958);
  ovrRows.innerHTML=tableRows(d.ovr,v=>v/1e9,130726559981);
  </script>
</body>
</html>
