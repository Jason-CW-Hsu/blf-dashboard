<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>勞動基金運用局｜基金儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    :root{--navy:#17365d;--blue:#5b9bd5;--orange:#ed7d31;--line:#d9e2f3;--bg:#f4f7fa}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#19324b;background:var(--bg)}header{padding:28px max(24px,calc((100vw - 1240px)/2));background:var(--navy);color:white}h1{font-size:24px;margin:0 0 8px}.sub{opacity:.8;font-size:14px}main{max-width:1240px;margin:24px auto;padding:0 20px}.cards,.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:24px}.card,.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:16px}.card b{display:block;font-size:24px;margin-top:8px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:24px}.grid.two{grid-template-columns:1fr 1fr}.panel h2{font-size:17px;margin:0 0 12px}.panel canvas{max-height:320px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}.fx{font-size:13px;background:#eaf3fb;border-left:4px solid var(--blue);padding:12px;margin-bottom:24px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.grid.two{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>勞動基金運用局｜四大基金儀表板</h1><div class="sub">資料期間：115 年 6 月｜資產以新臺幣億元呈現；國外委外依原始美元金額呈現</div></header>
  <main>
    <section class="cards" id="totals"></section>
    <div class="fx">美元換算：臺銀 USD/TWD 即期賣出 <b id="fx"></b>｜報價時間：<span id="quotedAt"></span>｜來源：<a href="https://rate.bot.com.tw/xrt?Lang=en-US" target="_blank" rel="noreferrer">臺灣銀行公開即時匯率</a></div>
    <section class="grid" id="fundCharts"></section>
    <section class="grid two"><div class="panel"><h2>國內委外｜前十大委託金額與市占率</h2><canvas id="domestic"></canvas></div><div class="panel"><h2>國外委外｜前十大委託金額與市占率</h2><canvas id="overseas"></canvas></div></section>
    <section class="panel"><h2>前十大業者明細</h2><table><thead><tr><th>區域</th><th>業者</th><th>委託金額</th><th>市占率</th></tr></thead><tbody id="rows"></tbody></table></section>
  </main>
  <script>
    const data={fx:31.945,quotedAt:'2026-08-26 04:40',funds:[['新制',57963.5,[7156.6,747.7,454.1,5859.3,15180.9,5570.3]],['舊制',11622.6,[308.4,234.0,0,1080.4,2413.1,1201.3]],['勞工保險',16820.7,[1905.5,936.8,108.6,939.4,2212.2,1383.9]],['國民年金',9043.3,[1081.9,574.3,226.5,427.2,1686.1,296.0]],['四大基金合計',95450.1,[10452.4,2492.8,789.3,8306.2,21492.3,8451.4]]],domestic:[['野村',233798388724,.226],['安聯',153336870651,.148],['國泰',124755806236,.121],['統一',118408499183,.115],['復華',114269363585,.110],['玉山',49410277565,.048],['滙豐',47530015104,.046],['台新',43351455547,.042],['施羅德',39300361947,.038],['富邦',27603507854,.027]],overseas:[['貝萊德',10862512457,.110],['道富',7606597782,.077],['北美信託',6137221459,.062],['PIMCO',5855623604,.060],['JPMorgan（國外）',5423864675,.055],['威靈頓',4625550093,.047],['Geode',4011738367,.041],['LGIM',4008355339,.041],['景順',3539309945,.036],['富達',3190338807,.032]]};
    const label=['自行運用-固定收益','自行運用-權益','自行運用-另類','委託經營-固定收益','委託經營-權益','委託經營-另類'],colors=['#9dc3e6','#5b9bd5','#2f75b5','#f4b183','#ed7d31','#c55a11'];
    document.querySelector('#fx').textContent=data.fx.toFixed(3);document.querySelector('#quotedAt').textContent=data.quotedAt;
    document.querySelector('#totals').innerHTML=data.funds.map(([n,t])=>`<div class="card"><span>${n}</span><b>${t.toLocaleString()} 億元</b></div>`).join('');
    const fundCharts=document.querySelector('#fundCharts');data.funds.forEach(([n,t,v],i)=>{fundCharts.insertAdjacentHTML('beforeend',`<div class="panel"><h2>${n}｜${t.toLocaleString()} 億元</h2><canvas id="fund${i}"></canvas></div>`);new Chart(document.querySelector('#fund'+i),{type:'doughnut',data:{labels:label,datasets:[{data:v,backgroundColor:colors}]},options:{plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>`${c.label}: ${c.formattedValue} 億元`}}}})});
    function ranked(id,items,unit){new Chart(document.querySelector(id),{data:{labels:items.map(x=>x[0]),datasets:[{type:'bar',label:'委託金額',data:items.map(x=>x[1]),backgroundColor:'#5b9bd5',yAxisID:'y'},{type:'line',label:'市占率',data:items.map(x=>x[2]*100),borderColor:'#ed7d31',backgroundColor:'#ed7d31',yAxisID:'y1',tension:.25}]},options:{scales:{y:{ticks:{callback:v=>Intl.NumberFormat('zh-TW',{notation:'compact'}).format(v)}},y1:{position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%'}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.yAxisID==='y1'?`${c.dataset.label}: ${c.parsed.y.toFixed(1)}%`:`${c.dataset.label}: ${c.parsed.y.toLocaleString()}`}}}}})}ranked('#domestic',data.domestic);ranked('#overseas',data.overseas);
    document.querySelector('#rows').innerHTML=[...data.domestic.map(x=>['國內',...x]),...data.overseas.map(x=>['國外',...x])].map(([r,n,a,s])=>`<tr><td>${r}</td><td>${n}</td><td>${a.toLocaleString()}</td><td>${(s*100).toFixed(1)}%</td></tr>`).join('');
  </script>
</body>
</html>
