<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>勞動基金運用局｜基金儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f4f7fa;color:#17365d}header{background:#17365d;color:#fff;padding:24px max(20px,calc((100vw - 1200px)/2))}h1{margin:0;font-size:24px}.sub{font-size:14px;opacity:.8;margin-top:8px}main{max-width:1200px;margin:24px auto;padding:0 20px}.cards,.charts{display:grid;gap:16px}.cards{grid-template-columns:repeat(5,1fr)}.charts{grid-template-columns:repeat(3,1fr);margin:20px 0}.wide{grid-template-columns:1fr 1fr}.card,.panel{background:#fff;border:1px solid #d9e2f3;border-radius:10px;padding:14px}.card b{display:block;font-size:22px;margin-top:8px}.panel h2{font-size:16px;margin:0 0 8px}.panel canvas{max-height:300px}.fx{background:#eaf3fb;border-left:4px solid #5b9bd5;padding:10px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}th,td{padding:8px;border-bottom:1px solid #d9e2f3;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:850px){.cards,.charts,.wide{grid-template-columns:1fr}}</style>
</head>
<body>
  <header><h1>勞動基金運用局｜四大基金儀表板</h1><div class="sub">資料期間：115 年 6 月｜資產配置金額：新臺幣億元</div></header>
  <main><section class="cards" id="totals"></section><p class="fx">美元換算：臺銀 USD/TWD 即期賣出 <b id="fx"></b>｜報價時間：2026-08-26 04:40｜<a href="https://rate.bot.com.tw/xrt?Lang=en-US">公開匯率來源</a></p><section class="charts" id="funds"></section><section class="charts wide"><div class="panel"><h2>國內委外｜前十大委託金額與市占率</h2><canvas id="domestic"></canvas></div><div class="panel"><h2>國外委外｜前十大委託金額與市占率</h2><canvas id="overseas"></canvas></div></section><section class="panel"><h2>前十大業者明細</h2><table><thead><tr><th>區域</th><th>業者</th><th>委託金額</th><th>市占率</th></tr></thead><tbody id="rows"></tbody></table></section></main>
  <script>
  const d={fx:31.945,f:[['新制',57963.5,[7156.6,747.7,454.1,5859.3,15180.9,5570.3]],['舊制',11622.6,[308.4,234,0,1080.4,2413.1,1201.3]],['勞工保險',16820.7,[1905.5,936.8,108.6,939.4,2212.2,1383.9]],['國民年金',9043.3,[1081.9,574.3,226.5,427.2,1686.1,296]],['四大基金合計',95450.1,[10452.4,2492.8,789.3,8306.2,21492.3,8451.4]]],dom:[['野村',233798388724,.226],['安聯',153336870651,.148],['國泰',124755806236,.121],['統一',118408499183,.115],['復華',114269363585,.11],['玉山',49410277565,.048],['滙豐',47530015104,.046],['台新',43351455547,.042],['施羅德',39300361947,.038],['富邦',27603507854,.027]],ovr:[['貝萊德',10862512457,.11],['道富',7606597782,.077],['北美信託',6137221459,.062],['PIMCO',5855623604,.06],['JPMorgan（國外）',5423864675,.055],['威靈頓',4625550093,.047],['Geode',4011738367,.041],['LGIM',4008355339,.041],['景順',3539309945,.036],['富達',3190338807,.032]]};
  const labs=['自行-固定收益','自行-權益','自行-另類','委託-固定收益','委託-權益','委託-另類'],c=['#9dc3e6','#5b9bd5','#2f75b5','#f4b183','#ed7d31','#c55a11'];document.querySelector('#fx').textContent=d.fx.toFixed(3);document.querySelector('#totals').innerHTML=d.f.map(x=>`<div class="card">${x[0]}<b>${x[1].toLocaleString()} 億元</b></div>`).join('');d.f.forEach((x,i)=>{funds.insertAdjacentHTML('beforeend',`<div class="panel"><h2>${x[0]}｜${x[1].toLocaleString()} 億元</h2><canvas id="f${i}"></canvas></div>`);new Chart(document.querySelector('#f'+i),{type:'doughnut',data:{labels:labs,datasets:[{data:x[2],backgroundColor:c}]},options:{plugins:{legend:{position:'bottom'}}}})});
  function bar(id,a){new Chart(document.querySelector(id),{data:{labels:a.map(x=>x[0]),datasets:[{type:'bar',label:'委託金額',data:a.map(x=>x[1]),backgroundColor:'#5b9bd5',yAxisID:'y'},{type:'line',label:'市占率',data:a.map(x=>x[2]*100),borderColor:'#ed7d31',yAxisID:'y1'}]},options:{scales:{y:{ticks:{callback:v=>Intl.NumberFormat('zh-TW',{notation:'compact'}).format(v)}},y1:{position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%'}}}}})}bar('#domestic',d.dom);bar('#overseas',d.ovr);rows.innerHTML=[...d.dom.map(x=>['國內',...x]),...d.ovr.map(x=>['國外',...x])].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2].toLocaleString()}</td><td>${(x[3]*100).toFixed(1)}%</td></tr>`).join('');
  </script>
</body>
</html>
